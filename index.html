    <style>
        /* Basic Reset & Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);

            min-height: 100vh;
            display: flex;
            justify-content: center;

        }

        /* Container Card */
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Headline Style */
        .headline {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff0055, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 20px rgba(0, 255, 204, 0.2);
        }

        .subheadline {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 40px;
            font-weight: 500;
        }

        /* Blinking Telegram Button */
        .tg-button {
            display: inline-block;
            width: 100%;
            padding: 16px 32px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            background-color: #0088cc;
            text-decoration: none;
            border-radius: 50px;
            transition: transform 0.2s ease;
            box-shadow: 0 0 0 0 rgba(0, 136, 204, 0.7);
            animation: pulse-blink 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
        }

        .tg-button:hover {
            transform: scale(1.02);
        }

        /* Blinking/Glowing Animation */
        @keyframes pulse-blink {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 136, 204, 0.7);
            }
            70% {
                transform: scale(1.03);
                box-shadow: 0 0 0 25px rgba(0, 136, 204, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 136, 204, 0);
            }
        }

        /* Small Footer Text */
        .footer-text {
            margin-top: 25px;
            font-size: 0.85rem;
